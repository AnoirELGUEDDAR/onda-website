apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alert-rule
  namespace: monitoring
spec:
  groups:
  - name: test.rules
    rules:
    - alert: AlwaysFiring
      expr: vector(1)
      for: 1m
      labels:
        severity: test
      annotations:
        summary: "This is a test alert"
        description: "AlwaysFiring alert just for testing email setup"
