apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: backend.rules
      rules:
        - alert: BackendDown
          expr: sum(up{job="backend", namespace="onda-app"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Backend is down"
            description: "No backend targets are up for at least 2 minutes."

        - alert: BackendHighErrorRate
          expr: sum(rate(http_server_requests_seconds_count{job="backend", namespace="onda-app", status=~"5.."}[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High 5xx error rate"
            description: "5xx > 1 req/s for 5 minutes."

        - alert: BackendHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="backend", namespace="onda-app"}[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High p95 latency"
            description: "p95 latency > 1s for 5 minutes."

        - alert: JvmHeapHigh
          expr: |
            (sum(jvm_memory_used_bytes{job="backend", namespace="onda-app", area="heap"})
             /
             sum(jvm_memory_max_bytes{job="backend", namespace="onda-app", area="heap"})) > 0.80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "JVM heap usage high"
            description: "Heap > 80% for 10 minutes."
